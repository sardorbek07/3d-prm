<script>

(function(){

const slides =
document.querySelectorAll('.cf-slide');

const dotsWrap =
document.querySelector('.cf-dots');

const prevBtn =
document.querySelector('.cf-prev');

const nextBtn =
document.querySelector('.cf-next');

let current = 0;


slides.forEach((_,i)=>{

const dot =
document.createElement('div');

dot.classList.add('cf-dot');

dot.addEventListener('click',()=>{

current=i;

render();

});

dotsWrap.appendChild(dot);

});


const dots =
document.querySelectorAll('.cf-dot');


function render(){

slides.forEach((slide,index)=>{

const offset =
index-current;

const abs =
Math.abs(offset);

let x =
offset*260;

let rotate =
offset*-65;

let scale =
.82;

let opacity =
.25;

let z =
100-abs;


if(offset===0){

x=0;

rotate=0;

scale=1;

opacity=1;

z=999;

}


slide.style.zIndex=z;


slide.style.transform=`

translateX(-50%)

translateX(${x}px)

translateZ(${-abs*180}px)

rotateY(${rotate}deg)

scale(${scale})

`;


slide.style.opacity =
abs>3 ? 0 : opacity;


slide.classList.toggle(
'active',
offset===0
);

});


dots.forEach((dot,i)=>{

dot.classList.toggle(
'active',
i===current
);

});

}


function goNext(){

current++;

if(current>=slides.length){

current=0;

}

render();

}


function goPrev(){

current--;

if(current<0){

current=slides.length-1;

}

render();

}


nextBtn.addEventListener(
'click',
goNext
);

prevBtn.addEventListener(
'click',
goPrev
);


render();


let dragStartX=0;

let isDragging=false;

const dragThreshold=50;


function handleDragStart(x){

dragStartX=x;

isDragging=true;

}


function handleDragEnd(x){

if(!isDragging)return;

isDragging=false;

const diff=
x-dragStartX;

if(
Math.abs(diff)
<dragThreshold
)return;

if(diff<0){

goNext();

}else{

goPrev();

}

}


coverflow.addEventListener(
'mousedown',
(e)=>{
handleDragStart(
e.clientX
);
}
);


coverflow.addEventListener(
'mouseup',
(e)=>{
handleDragEnd(
e.clientX
);
}
);


coverflow.addEventListener(
'mouseleave',
()=>{
isDragging=false;
}
);


coverflow.addEventListener(
'touchstart',
(e)=>{
handleDragStart(
e.touches[0].clientX
);
},
{passive:true}
);


coverflow.addEventListener(
'touchend',
(e)=>{
handleDragEnd(
e.changedTouches[0].clientX
);
}
);

})();

</script>

            } catch (error) {

                console.warn(
                    "Clipboard API ishlamadi. Fallback ishlatiladi.",
                    error
                );

                fallbackCopy();
            }

        } else {

            fallbackCopy();

        }

    };

})();
</script>
